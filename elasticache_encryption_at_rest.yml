AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sample security control: alerts on new Amazon ElastiCache replication groups created without encryption at rest (not for production use without review)'

###
### CloudFormation Interface Metadata
###

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Security Control Setup
        Parameters:
          - pLambdaZipBucket
          - pLambdaZipKey
          - pNotificationEmail
      - Label:
          default: Security Control Options
        Parameters:
          - pLoggingLevel
          - pReservedConcurrency
    ParameterLabels:
      pLambdaZipBucket:
        default: S3 Bucket
      pLambdaZipKey:
        default: S3 Key
      pNotificationEmail:
        default: Notification email
      pLoggingLevel:
        default: Lambda Logging level
      pReservedConcurrency:
        default: Reserved Concurrency

###
### Template input parameters
###

Parameters:
  pLambdaZipBucket:
    Type: String
    AllowedPattern: ^(?!-)[a-z0-9-]*(?<!-)$
    Description: Name of the Security Control zip bucket
    MinLength: 3
    MaxLength: 63
  pLambdaZipKey:
    Type: String
    AllowedPattern: ^.+\.zip$
    Description: The Security Control zip file key (e.g. functions/security-control.zip)
  pLoggingLevel:
    Type: String
    Default: INFO
    Description: Sets the logging level of your security control's Lambda function
    AllowedValues:
      - ERROR
      - WARNING
      - INFO
      - DEBUG
  pNotificationEmail:
    Type: String
    # No default, so the stack cannot be deployed with an address that never confirms
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be a valid email address
    Description: Email address to alert of any security control violations
  pReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Reserved concurrency for the Lambda function

###
### Template Resources
###

Resources:

  # KMS Key for SNS Topic Encryption
  rSNSEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for SNS topic encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Delegate key administration and usage to IAM in this account with an
          # explicit action list instead of kms:*. IAM policies (for example the
          # Lambda role's KMSPermissions statement) still control who can use the key.
          - Sid: AllowAccountKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:RotateKeyOnDemand
            Resource: '*'
          - Sid: AllowAccountKeyUsage
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Resource: '*'
          # CloudWatch alarms publish to the KMS-encrypted SNS topic.
          # Scoped by the encryption context SNS sets, so the key can only be
          # used for this stack's topic.
          - Sid: AllowCloudWatchAlarmsToUseKey
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:sns:topicArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-Notifications
          # EventBridge sends undeliverable events to the KMS-encrypted DLQ.
          # Scoped by the encryption context SQS sets, so the key can only be
          # used for this stack's queue.
          - Sid: AllowEventBridgeToUseKey
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:sqs:arn: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-DLQ
          # CloudWatch Logs encrypts this function's log group only. The exact
          # log group ARN in the encryption context stops other log groups in
          # the account from being associated with this key.
          - Sid: AllowCloudWatchLogsForFunctionLogGroup
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-LambdaFunction

  # KMS Key Alias
  rSNSEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-sns-encryption
      TargetKeyId: !Ref rSNSEncryptionKey

  # Managed IAM Policy for Lambda
  rLambdaManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-LambdaPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchLogsPermissions
            Effect: Allow
            # Log group is created by this template, so only stream/write access is needed
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            # GetAtt Arn already returns arn:...:log-group:<name>:* which scopes
            # access to this function's log group and its streams only. Do not
            # append ":log-stream:*"; that produces an ARN no stream matches and
            # the function silently stops writing logs.
            Resource: !GetAtt rLambdaLogGroup.Arn
          - Sid: SNSPublishPermissions
            Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref rNotifyTopicSNS
          - Sid: KMSPermissions
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !GetAtt rSNSEncryptionKey.Arn
          - Sid: SQSPermissions
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt rDLQ.Arn

  # Security Control IAM Role with least privilege
  rLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-LambdaRole
      ManagedPolicyArns:
        - !Ref rLambdaManagedPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

  # CloudWatch Log Group with retention
  rLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-LambdaFunction
      RetentionInDays: 30
      KmsKeyId: !GetAtt rSNSEncryptionKey.Arn

  # Security Control evaluation function
  rLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: rLambdaLogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              The function only reads the EventBridge event payload and calls the
              regional SNS API. It does not access any VPC resources, so VPC
              attachment adds NAT or VPC endpoint cost without reducing exposure.
              Deploy into a VPC with an SNS interface endpoint if your policy requires it.
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: Function does not access VPC resources (see CKV_AWS_117 justification)
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
    Properties:
      Role: !GetAtt rLambdaRole.Arn
      FunctionName: !Sub ${AWS::StackName}-LambdaFunction
      Runtime: python3.14
      Architectures:
        - x86_64
      Tags:
        - Key: Name
          Value: !Sub Lambda function - ${AWS::StackName}
        - Key: Purpose
          Value: ElastiCache Encryption Monitoring
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref pReservedConcurrency
      DeadLetterConfig:
        TargetArn: !GetAtt rDLQ.Arn
      Environment:
        Variables:
          OUTBOUND_TOPIC_ARN: !Ref rNotifyTopicSNS
          LOGGING_LEVEL: !Ref pLoggingLevel
      KmsKeyArn: !GetAtt rSNSEncryptionKey.Arn
      Handler: index.lambda_handler
      Code:
        S3Bucket: !Ref pLambdaZipBucket
        S3Key: !Ref pLambdaZipKey

  # Dead Letter Queue for failed invocations
  rDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-DLQ
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: !Ref rSNSEncryptionKey

  # SQS Policy to enforce SSL-only access
  rDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref rDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt rDLQ.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # Allow only this stack's EventBridge rule to write failed events to the DLQ
          - Sid: AllowEventBridgeRuleDLQ
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt rDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt rEventBridgeRule.Arn

  # EventBridge rule to trigger evaluation (replaces CloudWatch Events)
  rEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-ElastiCacheRule
      Description: Monitors ElastiCache CreateReplicationGroup API calls
      EventPattern:
        source:
          - aws.elasticache
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - elasticache.amazonaws.com
          eventName:
            - CreateReplicationGroup
      State: ENABLED
      Targets:
        - Arn: !GetAtt rLambdaFunction.Arn
          Id: !Sub ${AWS::StackName}-LambdaTarget
          RetryPolicy:
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt rDLQ.Arn

  # Lambda permission - EventBridge can trigger evaluation
  rLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt rLambdaFunction.Arn
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt rEventBridgeRule.Arn

  # Encrypted SNS topic for notifications
  rNotifyTopicSNS:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-Notifications
      DisplayName: ElastiCache Encryption Compliance Notifications
      KmsMasterKeyId: !Ref rSNSEncryptionKey
      Subscription:
        - Endpoint: !Ref pNotificationEmail
          Protocol: email

  # SNS topic policy: enforce TLS and limit service publishers to this account's alarms
  rNotifyTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref rNotifyTopicSNS
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref rNotifyTopicSNS
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref rNotifyTopicSNS
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*

  # CloudWatch Alarm for Lambda errors
  rLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-LambdaErrors
      AlarmDescription: Alarm for Lambda function errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref rLambdaFunction
      AlarmActions:
        - !Ref rNotifyTopicSNS

  # CloudWatch Alarm for DLQ messages
  rDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-DLQMessages
      AlarmDescription: Alarm for messages in Dead Letter Queue
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      TreatMissingData: notBreaching
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt rDLQ.QueueName
      AlarmActions:
        - !Ref rNotifyTopicSNS

###
### Outputs
###

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt rLambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaArn

  SNSTopicArn:
    Description: ARN of the SNS notification topic
    Value: !Ref rNotifyTopicSNS
    Export:
      Name: !Sub ${AWS::StackName}-SNSTopicArn

  EventBridgeRuleArn:
    Description: ARN of the EventBridge rule
    Value: !GetAtt rEventBridgeRule.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EventRuleArn